name: atendsaude

services:
  db:
    image: postgres:16-alpine
    container_name: atendsaude_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-atendsaude}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - atendsaude_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-atendsaude}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atendsaude_net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: atendsaude_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atendsaude_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: atendsaude_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - atendsaude_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - atendsaude_net

volumes:
  atendsaude_pgdata:
  atendsaude_node_modules:

networks:
  atendsaude_net:
    driver: bridge
